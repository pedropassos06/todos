services:
  localstack:
    image: localstack/localstack:3.8.1
    ports:
      - "4566:4566"
    env_file:
      - .env
    environment:
      - SERVICES=dynamodb
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD-SHELL", "awslocal dynamodb list-tables >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8081:8081"
    env_file:
      - .env
    depends_on:
      localstack:
        condition: service_healthy
